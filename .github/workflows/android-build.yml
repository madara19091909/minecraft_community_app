name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build AAB"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.blockverse --project-name blockverse .
          fi

      - name: Configure Android notifications and desugaring
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\
            <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          if ! grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' "$MANIFEST"
          fi

          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY2'
from pathlib import Path
p=Path("android/app/build.gradle.kts")
s=p.read_text()
if "isCoreLibraryDesugaringEnabled = true" not in s:
    s=s.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)
if "coreLibraryDesugaring("com.android.tools:desugar_jdk_libs" not in s:
    marker="dependencies {"
    if marker in s:
        s=s.replace(marker, marker+"\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")", 1)
    else:
        s += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")\n}\n"
p.write_text(s)
PY2
          elif [ -f android/app/build.gradle ]; then
            python3 - <<'PY2'
from pathlib import Path
p=Path("android/app/build.gradle")
s=p.read_text()
if "coreLibraryDesugaringEnabled true" not in s:
    s=s.replace("android {", "android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }", 1)
if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs" not in s:
    marker="dependencies {"
    dep="    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n"
    if marker in s:
        s=s.replace(marker, marker+dep, 1)
    else:
        s += "\ndependencies {\n"+dep+"}\n"
p.write_text(s)
PY2
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build AAB
        if: github.event_name == 'push' || inputs.build_aab == true
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blockverse-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: github.event_name == 'push' || inputs.build_aab == true
        uses: actions/upload-artifact@v4
        with:
          name: blockverse-aab
          path: build/app/outputs/bundle/release/app-release.aab
