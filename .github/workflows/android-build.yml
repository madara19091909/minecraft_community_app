name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build AAB"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create               --platforms=android               --org com.blockverse               --project-name blockverse               .
          fi

      - name: Set app name to MC and install launcher icon
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          ICON_SRC="assets/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi

          if [ ! -f "$ICON_SRC" ]; then
            echo "App icon not found: $ICON_SRC"
            exit 1
          fi

          # App name shown under the launcher icon.
          sed -i 's/android:label="[^"]*"/android:label="MC"/' "$MANIFEST"

          # Generate standard Android launcher sizes.
          declare -A SIZES=(
            [mipmap-mdpi]=48
            [mipmap-hdpi]=72
            [mipmap-xhdpi]=96
            [mipmap-xxhdpi]=144
            [mipmap-xxxhdpi]=192
          )

          for dir in "${!SIZES[@]}"; do
            mkdir -p "$RES/$dir"
            convert "$ICON_SRC" -resize "${SIZES[$dir]}x${SIZES[$dir]}" "$RES/$dir/mc_launcher.png"
          done

          # Force the manifest to use our generated icon.
          sed -i 's#android:icon="@mipmap/[^"]*"#android:icon="@mipmap/mc_launcher"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then
            sed -i 's#android:roundIcon="@mipmap/[^"]*"#android:roundIcon="@mipmap/mc_launcher"#' "$MANIFEST"
          fi

          echo "App name/icon configured: MC"

      - name: Ensure Android Internet permission
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a            <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build AAB
        if: github.event_name == 'push' || inputs.build_aab == true
        run: |
          flutter build appbundle --release             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blockverse-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: github.event_name == 'push' || inputs.build_aab == true
        uses: actions/upload-artifact@v4
        with:
          name: blockverse-aab
          path: build/app/outputs/bundle/release/app-release.aab
